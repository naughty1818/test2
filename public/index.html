<!doctype html>
<html lang="bn">
<head>

  <meta name="theme-color" content="#07120f">
  <meta name="application-name" content="Atharo | আঠারো">

  <meta name="description" content="Atharo | আঠারো — বাংলা ভিডিও, নিজের ভাষায়, নিজের মানুষের কাছে।">

  <link rel="icon" type="image/png" sizes="48x48" href="/assets/atharo-favicon.png?v=atharo-icon-2">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/atharo-apple-touch-icon.png?v=atharo-icon-2">
  <link rel="manifest" href="/manifest.webmanifest?v=atharo-icon-2">
  <link rel="stylesheet" href="/clipnest.css?v=atharo-1">
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <button class="icon-button mobile-menu-trigger" id="mobileToggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="মেনু খুলুন">☰</button>
      <a href="/" data-route class="brand-lockup" aria-label="Atharo | আঠারো হোম">
        <span class="brand-latin">Atharo |</span>
        <img class="brand-logo" src="/assets/atharo-logo.png" alt="Atharo | আঠারো">
      </a>
      <form class="top-search" id="searchForm" role="search">
        <span aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" placeholder="ভিডিও, চ্যানেল খুঁজে দেখো" aria-label="ভিডিও খুঁজুন" autocomplete="off">
        <button type="submit" aria-label="সার্চ করো">⌕</button>
      </form>
      <div class="top-actions">
        <a href="/upload" data-route class="upload-link"><span aria-hidden="true">＋</span><span>আপলোড</span></a>
        <div id="accountArea"></div>
      </div>
    </header>
    <div class="page-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-label">দেখো</div>
        <nav aria-label="প্রধান নেভিগেশন">
          <a href="/" data-route data-nav="home" class="nav-item"><span aria-hidden="true">⌂</span><span>হোম</span></a>
          <a href="/search" data-route data-nav="search" class="nav-item"><span aria-hidden="true">⌕</span><span>খুঁজে দেখো</span></a>
          <a href="/subscriptions" data-route data-nav="subscriptions" class="nav-item"><span aria-hidden="true">▤</span><span>সাবস্ক্রিপশন</span></a>
          <a href="/channels" data-route data-nav="channels" class="nav-item"><span aria-hidden="true">◉</span><span>চ্যানেল</span></a>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-label">তোমার লাইব্রেরি</div>
        <nav aria-label="ব্যক্তিগত লাইব্রেরি">
          <a href="/history" data-route data-nav="history" class="nav-item"><span aria-hidden="true">◷</span><span>দেখার ইতিহাস</span></a>
          <a href="/playlists" data-route data-nav="playlists" class="nav-item"><span aria-hidden="true">▣</span><span>প্লেলিস্ট ও পরে দেখব</span></a>
          <a href="/channel/me" data-route data-nav="my-channel" class="nav-item"><span aria-hidden="true">♡</span><span>আমার চ্যানেল</span></a>
          <a href="/upload" data-route data-nav="upload" class="nav-item"><span aria-hidden="true">↑</span><span>ভিডিও আপলোড</span></a>
        </nav>
        <div class="sidebar-note">
          <div class="sidebar-note-icon"><span aria-hidden="true">▷</span></div>
          <p>তোমার গল্প, তোমার কণ্ঠে।</p>
          <span>বাংলা ভিডিওর নতুন ঠিকানা</span>
        </div>
        <div class="sidebar-footer">© ২০২৬ Atharo | আঠারো · নিজের মতো দেখো</div>
      </aside>
      <main class="main-content" id="app" tabindex="-1"></main>
    </div>
    <nav class="mobile-bottom-nav" aria-label="মোবাইল নেভিগেশন">
      <a href="/" data-route data-mobile-nav="home"><span>⌂</span><span>হোম</span></a>
      <a href="/search" data-route data-mobile-nav="search"><span>⌕</span><span>খুঁজে দেখো</span></a>
      <a href="/subscriptions" data-route data-mobile-nav="subscriptions"><span>▤</span><span>সাবস্ক্রিপশন</span></a>
      <a href="/playlists" data-route data-mobile-nav="playlists"><span>▣</span><span>লাইব্রেরি</span></a>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/console.js"></script>
  <script>
  'use strict';
  const app = document.getElementById('app');
  const accountArea = document.getElementById('accountArea');
  const sidebar = document.getElementById('sidebar');
  const mobileToggle = document.getElementById('mobileToggle');
  const searchForm = document.getElementById('searchForm');
  const globalSearch = document.getElementById('globalSearch');
  const toast = document.getElementById('toast');
  const socket = typeof io === 'function' ? io({ transports: ['websocket', 'polling'] }) : null;
  const state = {
    config: { maxFileMb: 500, googleLoginEnabled: false },
    session: { user: null, profile: null }, admin: null,
    category: '', query: '', routeToken: 0, toastTimer: null,
    currentVideoId: null, currentChannelHandle: null, commentNodes: new Map()
  };
  const categories = [
    { value: '', label: 'সব ভিডিও' }, { value: 'ভ্রমণ', label: 'ভ্রমণ' },
    { value: 'রান্না', label: 'রান্না' }, { value: 'ক্রিয়েটর', label: 'ক্রিয়েটর' },
    { value: 'গল্প', label: 'গল্প' }, { value: 'শেখা', label: 'শেখা' },
    { value: 'অন্যান্য', label: 'অন্যান্য' }
  ];
  const thumbnailByCategory = {
    'ভ্রমণ': '/assets/clipnest-sylhet-hills.webp', 'রান্না': '/assets/clipnest-khichuri.webp',
    'ক্রিয়েটর': '/assets/clipnest-creator-studio.webp', 'গল্প': '/assets/clipnest-river-boat.webp',
    'শেখা': '/assets/clipnest-creator-studio.webp', 'অন্যান্য': '/assets/clipnest-river-boat.webp'
  };
  const avatarColors = ['#e97855', '#ce825c', '#536f8e', '#5f8c70'];
  function $(tag, props = {}, children = []) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key === 'htmlFor') el.htmlFor = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key === 'value') el.value = value;
      else if (key === 'disabled') el.disabled = Boolean(value);
      else if (key === 'checked') { el.checked = Boolean(value); el.defaultChecked = Boolean(value); }
      else if (key === 'hidden') el.hidden = Boolean(value);
      else if (key === 'style' && typeof value === 'object') Object.assign(el.style, value);
      else el.setAttribute(key, value);
    }
    for (const child of children || []) if (child) el.append(child);
    return el;
  }
  const text = (value, fallback = '') => value === null || value === undefined ? fallback : String(value);
  const escapePath = value => encodeURIComponent(text(value));
  const initials = value => text(value, 'C').trim().slice(0, 1).toLocaleUpperCase('bn-BD') || 'C';
  const number = value => (Number(value) || 0).toLocaleString('bn-BD');
  function formatDuration(value) { const n=Math.max(0,Math.floor(Number(value)||0));if(!n)return '';const h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; }
  const thumbFor = category => thumbnailByCategory[category] || thumbnailByCategory['অন্যান্য'];
  const getName = (profile, user) => text(profile && profile.displayName, text(user && (user.name || user.email), 'ভিডিও নির্মাতা'));
  const getHandle = (profile, user) => text(profile && profile.handle, text(user && (user.handle || user.name), 'member')).replace(/^@/, '');
  function fmtDate(date) {
    if (!date) return 'তারিখ অজানা';
    const age = Math.max(0, Date.now() - new Date(date).getTime());
    if (age < 60 * 60 * 1000) return Math.max(1, Math.floor(age / 60000)) + ' মিনিট আগে';
    if (age < 24 * 60 * 60 * 1000) return Math.floor(age / 3600000) + ' ঘণ্টা আগে';
    if (age < 30 * 24 * 60 * 60 * 1000) return Math.floor(age / 86400000) + ' দিন আগে';
    try { return new Intl.DateTimeFormat('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(date)); }
    catch (_) { return text(date); }
  }
  function fmtSize(bytes) {
    const n = Number(bytes) || 0;
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
    if (n >= 1048576) return Math.round(n / 1048576) + ' MB';
    return Math.round(n / 1024) + ' KB';
  }
  function notify(message, kind = '') {
    toast.textContent = message;
    toast.className = 'toast show' + (kind === 'error' ? ' toast-error' : '');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { toast.className = 'toast'; }, 3600);
  }
  async function jsonFetch(url, options = {}) {
    const opts = { credentials: 'same-origin', ...options, headers: { Accept: 'application/json', ...(options.headers || {}) } };
    if (opts.body && typeof opts.body !== 'string') { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.body); }
    const response = await fetch(url, opts);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) { const error = new Error(text(data.error, text(data.message, 'অনুরোধটি সম্পন্ন করা যায়নি।'))); error.status = response.status; throw error; }
    return data;
  }
  function button(label, cls = '', handler = null) { return $('button', { type: 'button', class: cls, text: label, ...(handler ? { onClick: handler } : {}) }); }
  function linkButton(label, path, cls = 'primary-cta') { return $('a', { href: path, 'data-route': '', class: cls, text: label }); }
  function setPage(children) { app.replaceChildren(...children); app.focus({ preventScroll: true }); }
  function loadingPage(message = 'লোড হচ্ছে…') { setPage([$ ('div', { class: 'empty-state' }, [$('span', { class: 'empty-state-icon', text: '…' }), $('h3', { text: message })])]); }
  function closeMobile() { sidebar.classList.remove('sidebar-open'); mobileToggle.setAttribute('aria-expanded', 'false'); }
  function leaveRealtimeRooms() {
    if (socket && state.currentVideoId) socket.emit('video:leave', state.currentVideoId);
    if (socket && state.currentChannelHandle) socket.emit('channel:leave', state.currentChannelHandle);
    state.currentVideoId = null; state.currentChannelHandle = null; state.commentNodes.clear();
    window.__addClipNestComment = null;
  }
  function navigate(path) {
    if (location.pathname + location.search !== path) history.pushState({}, '', path);
    closeMobile(); renderRoute();
  }
  function updateNav(path) {
    document.querySelectorAll('[data-nav]').forEach(link => {
      const target = link.dataset.nav;
      const active = target === 'home' ? path === '/' : target === 'search' ? path.startsWith('/search') : target === 'upload' ? path === '/upload' : target === 'subscriptions' ? path.startsWith('/subscriptions') : target === 'history' ? path.startsWith('/history') : target === 'playlists' ? path.startsWith('/playlists') || path.startsWith('/playlist/') : target === 'channels' ? path.startsWith('/channels') || (path.startsWith('/channel/') && path !== '/channel/me') : target === 'my-channel' ? path === '/channel/me' : false;
      link.classList.toggle('nav-item-active', active);
    });
    document.querySelectorAll('[data-mobile-nav]').forEach(link => {
      const target = link.dataset.mobileNav;
      const active = target === 'home' ? path === '/' : target === 'search' ? path.startsWith('/search') : target === 'subscriptions' ? path.startsWith('/subscriptions') : target === 'playlists' ? path.startsWith('/playlists') || path.startsWith('/playlist/') : false;
      link.classList.toggle('mobile-nav-active', active);
    });
  }
  function renderAccount() {
    accountArea.replaceChildren();
    if (!state.session.user) {
      const login = button('লগইন', 'login-button', () => state.config.googleLoginEnabled ? location.assign('/auth/google') : notify('Google OAuth hosting-এ সেটআপ করা হয়নি।', 'error'));
      login.setAttribute('aria-label', 'Google দিয়ে লগইন');
      if (!state.config.googleLoginEnabled) login.title = 'Google OAuth credentials configure করা নেই';
      accountArea.append(login); return;
    }
    const name = getName(state.session.profile, state.session.user);
    const avatar = $('span', { class: 'user-avatar', text: initials(name) });
    const toggle = $('button', { type: 'button', class: 'account-toggle', 'aria-expanded': 'false', 'aria-label': 'অ্যাকাউন্ট মেনু' }, [avatar, $('span', { class: 'account-name', text: name }), $('span', { class: 'chevron', text: '⌄' })]);
    const menu = $('div', { class: 'account-menu' });
    menu.append($('div', { class: 'menu-note', text: name }));
    [['আমার চ্যানেল', '/channel/me'], ['Creator Studio', '/studio'], ['সাবস্ক্রিপশন', '/subscriptions'], ['প্লেলিস্ট', '/playlists'], ['ভিডিও আপলোড', '/upload']].forEach(([label, href]) => menu.append($('a', { href, 'data-route': '', text: label })));
    if (state.admin?.role) menu.append($('a', { href: '/admin', 'data-route': '', text: 'Admin control panel' }));
    menu.append($('button', { type: 'button', class: 'logout-item', text: 'লগআউট', onClick: async () => {
      try { await jsonFetch('/auth/logout', { method: 'POST', body: {} }); state.session = { user: null, profile: null }; renderAccount(); notify('লগআউট হয়েছে।'); renderRoute(); }
      catch (error) { notify(error.message, 'error'); }
    } }));
    toggle.addEventListener('click', () => { const open = menu.classList.toggle('open'); toggle.setAttribute('aria-expanded', String(open)); });
    accountArea.append($('div', { class: 'account-wrap' }, [toggle, menu]));
  }
  function emptyState(title, description, ctaText = '', href = '/') {
    const box = $('div', { class: 'empty-state' });
    box.append($('span', { class: 'empty-state-icon', text: '✳' }), $('h3', { text: title }), $('p', { text: description }));
    if (ctaText) box.append(linkButton(ctaText, href, 'text-link'));
    return box;
  }
  function categoryChips(active, onChoose, className = 'category-strip') {
    const strip = $('div', { class: className, role: 'tablist', 'aria-label': 'ভিডিও বিভাগ' });
    categories.forEach(item => {
      const chip = button(item.label, 'category-chip' + (active === item.value ? ' category-chip-active' : ''), () => onChoose(item.value));
      chip.setAttribute('role', 'tab'); chip.setAttribute('aria-selected', String(active === item.value)); strip.append(chip);
    });
    return strip;
  }
  function avatar(name, url, className = 'creator-avatar') {
    const node = $('span', { class: className, style: { background: avatarColors[Math.abs(text(name).length) % avatarColors.length] }, text: initials(name) });
    if (url) {
      const img = $('img', { src: url, alt: '', referrerpolicy: 'no-referrer', loading: 'lazy' });
      img.addEventListener('error', () => img.remove()); node.replaceChildren(img);
    }
    return node;
  }
  function videoCard(video, options = {}) {
    const card = $('article', { class: 'video-card' + (options.featured ? ' video-card-featured' : '') });
    const watchPath = '/watch/' + escapePath(video.id);
    const thumbLink = $('a', { href: watchPath, 'data-route': '', class: 'video-thumb-link', 'aria-label': text(video.title, 'ভিডিও দেখো') });
    const thumb = $('div', { class: 'video-thumb', style: { '--thumb-accent': avatarColors[Math.abs(text(video.category).length) % avatarColors.length] } });
    const img = $('img', { src: video.thumbnailUrl || thumbFor(video.category), alt: '', loading: 'lazy' });
    img.addEventListener('error', () => img.remove());
    thumb.append(img, $('span', { class: 'thumb-overlay' }), $('span', { class: 'thumb-play' }, [$('span', { class: 'play-glyph' })]), $('span', { class: 'video-duration', text: formatDuration(video.durationSeconds) || text(video.category, 'Atharo') }));
    if(Number(video.currentSeconds)>0&&Number(video.durationSeconds)>0){const progress=$('span',{class:'resume-progress'});progress.style.width=Math.min(100,Math.max(0,Number(video.currentSeconds)/Number(video.durationSeconds)*100))+'%';thumb.append(progress);}
    thumbLink.append(thumb);
    const body = $('div', { class: 'video-card-body' });
    const ownerName = text(video.ownerName, 'Atharo নির্মাতা');
    const ownerHandle = text(video.ownerHandle, '');
    const creatorLink = ownerHandle ? '/channel/' + escapePath(ownerHandle) : '/channels';
    const creator = $('a', { href: creatorLink, 'data-route': '', class: 'creator-avatar-link', 'aria-label': ownerName }, [avatar(ownerName, video.ownerAvatar)]);
    const copy = $('div', { class: 'video-copy' });
    copy.append($('a', { href: watchPath, 'data-route': '', class: 'video-title', text: text(video.title, 'শিরোনামহীন ভিডিও') }));
    copy.append($('a', { href: creatorLink, 'data-route': '', class: 'creator-name', text: ownerName }));
    const meta = $('div', { class: 'video-meta' });
    meta.append($('span', { text: number(video.viewsCount) + ' ভিউ' }), $('span', { class: 'meta-dot' }), $('span', { text: fmtDate(video.created) }));
    copy.append(meta);
    const actions = $('div', { class: 'card-actions' });
    const likeButton = $('button', { type: 'button', class: 'card-icon' + (video.liked ? ' card-icon-liked' : ''), 'aria-label': video.liked ? 'লাইক সরাও' : 'লাইক দাও' });
    likeButton.append($('span', { class: 'heart-icon', text: video.liked ? '♥' : '♡' }), $('span', { class: 'card-like-count', text: number(video.likesCount) }));
    likeButton.addEventListener('click', async event => {
      event.preventDefault(); event.stopPropagation();
      if (!state.session.user) { notify('লাইক দিতে আগে Google দিয়ে লগইন করো।'); navigate('/login'); return; }
      likeButton.disabled = true;
      try {
        const result = await jsonFetch('/api/videos/' + encodeURIComponent(video.id) + '/like', { method: 'POST', body: {} });
        video.liked = result.liked; video.likesCount = result.likesCount;
        likeButton.classList.toggle('card-icon-liked', result.liked); likeButton.querySelector('.heart-icon').textContent = result.liked ? '♥' : '♡';
        likeButton.querySelector('.card-like-count').textContent = number(result.likesCount); likeButton.setAttribute('aria-label', result.liked ? 'লাইক সরাও' : 'লাইক দাও');
      } catch (error) { notify(error.message, 'error'); } finally { likeButton.disabled = false; }
    });
    actions.append(likeButton);
    const save = button(video.watchLater ? '▣' : '＋', 'card-icon card-save', async event => {
      if (!state.session.user) { notify('পরে দেখার তালিকায় রাখতে লগইন করো।'); navigate('/login'); return; }
      save.disabled = true;
      try { const result = await jsonFetch('/api/me/watch-later/' + encodeURIComponent(video.id), { method: 'POST', body: {} }); video.watchLater = result.saved; save.textContent = result.saved ? '▣' : '＋'; notify(result.saved ? 'পরে দেখার তালিকায় যোগ হয়েছে।' : 'তালিকা থেকে সরানো হয়েছে।'); }
      catch (error) { notify(error.message, 'error'); } finally { save.disabled = false; }
    });
    save.title = video.watchLater ? 'পরে দেখার তালিকা থেকে সরাও' : 'পরে দেখার জন্য রাখো'; actions.append(save);
    if (options.playlistId) actions.append(button('×', 'card-icon card-remove', async () => {
      try { await jsonFetch(`/api/playlists/${encodeURIComponent(options.playlistId)}/videos/${encodeURIComponent(video.id)}`, { method: 'DELETE' }); card.remove(); notify('প্লেলিস্ট থেকে সরানো হয়েছে।'); }
      catch (error) { notify(error.message, 'error'); }
    }));
    body.append(creator, copy, actions); card.append(thumbLink, body); return card;
  }
  function embeddedImageUrl(value) {
    try {
      const url = new URL(String(value || ''));
      if (url.protocol !== 'https:') return '';
      if (url.hostname === 'drive.google.com') {
        const id = url.pathname.match(/^\/file\/d\/([^/]+)/)?.[1] || url.searchParams.get('id');
        if (id) return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id);
      }
      return url.toString();
    } catch (_) { return ''; }
  }
  function sponsoredCard(ad, videoId = null, compact = false) {
    const card = $('article', { class: 'sponsored-card' + (compact ? ' sponsored-watch' : '') });
    const link = $('a', { href: text(ad.destinationUrl, '#'), target: '_blank', rel: 'noopener noreferrer', 'aria-label': text(ad.title, 'Sponsored') });
    const image = $('img', { src: embeddedImageUrl(ad.creativeUrl), alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
    image.addEventListener('error', () => image.remove());

      } catch (error) { notice.className = 'notice notice-warn'; notice.textContent = 'Upload সম্পন্ন হয়নি: ' + error.message; notice.hidden = false; progressWrap.hidden = true; }
      finally { submit.disabled = false; fileInput.disabled = false; }
    });
    page.append(form);
    setPage([page]);
  }
  function putFile(url, file, onProgress, contentType) {
    return new Promise((resolve, reject) => { const xhr = new XMLHttpRequest(); xhr.open('PUT', url); xhr.setRequestHeader('Content-Type', contentType); xhr.upload.onprogress = event => { if (event.lengthComputable) onProgress(Math.round(event.loaded / event.total * 100)); }; xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error('R2 upload failed (HTTP ' + xhr.status + '). CORS policy পরীক্ষা করো।')); xhr.onerror = () => reject(new Error('Network/CORS সমস্যায় upload থেমে গেছে।')); xhr.send(file); });
  }
  function renderNotFound() { setPage([emptyState('এই পেজটি পাওয়া যায়নি', 'লিংকটি পরীক্ষা করে আবার চেষ্টা করো।', 'Atharo | আঠারো হোম', '/')]); }
  async function renderRoute() {
    leaveRealtimeRooms(); const token = ++state.routeToken; const path = location.pathname;
    if (path === '/') { document.title = 'Atharo | আঠারো · বাংলা ভিডিও'; return renderHome(token); }
    if (path === '/search') { document.title = 'খুঁজে দেখো · Atharo | আঠারো'; return renderSearch(token); }
    if (path === '/login') { document.title = 'লগইন · Atharo | আঠারো'; return renderLogin(); }
    if (path === '/upload') { document.title = 'ভিডিও আপলোড · Atharo | আঠারো'; return renderUpload(); }
    if (path === '/studio') { document.title = 'Creator Studio · Atharo | আঠারো'; return window.AtharoConsole.renderStudio(app, { jsonFetch, notify }); }
    if (path === '/admin') { document.title = 'Admin · Atharo | আঠারো'; return window.AtharoConsole.renderAdmin(app, { jsonFetch, notify, adminRole: state.admin?.role || null, navigate }); }
    if (path === '/channels') { document.title = 'চ্যানেল · Atharo | আঠারো'; return renderChannels(token); }
    if (path === '/subscriptions') { document.title = 'সাবস্ক্রিপশন · Atharo | আঠারো'; return renderSubscriptions(token); }
    if (path === '/history') { document.title = 'দেখার ইতিহাস · Atharo | আঠারো'; return renderHistory(token); }
    if (path === '/playlists') { document.title = 'প্লেলিস্ট · Atharo | আঠারো'; return renderPlaylists(token); }
    if (path.startsWith('/watch/')) { const id = decodeURIComponent(path.slice('/watch/'.length)); document.title = 'ভিডিও · Atharo | আঠারো'; return renderWatch(id, token); }
    if (path.startsWith('/channel/')) { const handle = decodeURIComponent(path.slice('/channel/'.length)); document.title = 'চ্যানেল · Atharo | আঠারো'; return renderChannel(handle, token); }
    if (path.startsWith('/playlist/')) { const id = decodeURIComponent(path.slice('/playlist/'.length)); document.title = 'প্লেলিস্ট · Atharo | আঠারো'; return renderPlaylist(id, token); }
    renderNotFound();
  }
  document.addEventListener('click', event => {
    const link = event.target.closest('a[data-route]'); if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.target === '_blank') return;
    const url = new URL(link.href, location.href); if (url.origin !== location.origin) return;
    event.preventDefault(); navigate(url.pathname + url.search);
  });
  window.addEventListener('popstate', renderRoute);
  mobileToggle.addEventListener('click', () => { const open = sidebar.classList.toggle('sidebar-open'); mobileToggle.setAttribute('aria-expanded', String(open)); });
  searchForm.addEventListener('submit', event => { event.preventDefault(); state.query = globalSearch.value.trim(); state.category = ''; navigate('/search' + (state.query ? '?q=' + encodeURIComponent(state.query) : '')); });
  if (socket) {
    socket.on('connect', () => { if (state.currentVideoId) socket.emit('video:join', state.currentVideoId); if (state.currentChannelHandle) socket.emit('channel:join', state.currentChannelHandle); });
    socket.on('video:stats', counts => { if (counts.videoId !== state.currentVideoId) return; const stats = document.querySelector('.watch-stats'); if (stats) stats.textContent = number(counts.likesCount) + ' লাইক · ' + number(counts.viewsCount) + ' ভিউ'; const subtitle = document.querySelector('.watch-subtitle>span:first-child'); if (subtitle) subtitle.textContent = number(counts.viewsCount) + ' ভিউ'; const heading = document.querySelector('.comment-count'); if (heading) heading.textContent = number(counts.commentsCount) + 'টি মন্তব্য'; const like = document.querySelector('.watch-actions .action-pill'); if (like) like.textContent = (like.classList.contains('action-pill-liked') ? '♥  ' : '♡  ') + number(counts.likesCount); });
    socket.on('comment:new', comment => { if (comment.videoId !== state.currentVideoId) return; if (window.__addClipNestComment) window.__addClipNestComment(comment); });
    socket.on('channel:stats', message => { if (message.handle !== state.currentChannelHandle) return; document.querySelectorAll('.subscriber-count,.channel-subscribers').forEach(node => { node.textContent = number(message.subscribersCount) + ' জন সাবস্ক্রাইবার'; }); });
  }
  (async function init() {
    try { const [config, auth] = await Promise.all([jsonFetch('/api/config'), jsonFetch('/auth/me')]); state.config = config; state.session = auth; state.admin = auth.user ? await jsonFetch('/api/admin/me').catch(() => null) : null; }
    catch (_) { state.session = { user: null, profile: null }; state.admin = null; }
    renderAccount(); renderRoute();
  })();
  </script>
</body>
</html>
