  (() => {
    const splash = document.getElementById('introSplash');
    const video = document.getElementById('introSplashVideo');
    if (!splash || !video) return;
    let dismissed = false;
    const closeSplash = () => {
      if (dismissed) return;
      dismissed = true;
      splash.classList.add('intro-splash-hidden');
      window.setTimeout(() => splash.remove(), 520);
    };
    video.addEventListener('ended', closeSplash, { once: true });
    video.addEventListener('error', closeSplash, { once: true });
    window.setTimeout(closeSplash, 6500);
    const playPromise = video.play();
    if (playPromise?.catch) playPromise.catch(closeSplash);
  })();
  </script>

    let stored='bn';try{stored=localStorage.getItem('atharo:language')==='en'?'en':'bn';}catch(_){}
    try { window.AtharoI18n?.setLocale(stored,{rerender:false}); } catch(error) { console.warn('Could not initialize selected language:',error); }
    if(languageSelect){languageSelect.value=stored;languageSelect.addEventListener('change',()=>{try{if(window.AtharoI18n)window.AtharoI18n.setLocale(languageSelect.value);else safeRenderRoute();}catch(error){console.error('Could not change language:',error);safeRenderRoute();}});}
  }
  initializeLanguage();
  try { renderAccount(); } catch(error) { console.error('Account UI failed to initialize:',error); }
  try { renderNotifications(); } catch(error) { console.error('Notification UI failed to initialize:',error); }
  safeRenderRoute();
  (async function init() {
    const [configResult,authResult]=await Promise.allSettled([jsonFetch('/api/config'),jsonFetch('/auth/me')]);
    if(configResult.status==='fulfilled')state.config={...state.config,...configResult.value};
    if(authResult.status==='fulfilled')state.session=authResult.value;
    else state.session={user:null,profile:null};
    state.admin=state.session.user?await jsonFetch('/api/admin/me').catch(()=>null):null;
    try { renderAccount(); } catch(error) { console.error('Account UI failed to update:',error); }
    try { renderNotifications(); } catch(error) { console.error('Notification UI failed to update:',error); }
    await safeRenderRoute();refreshNotifications();
  })().catch(error=>{console.error('Atharo startup failed:',error);safeRenderRoute();});
  </script>
</body>
</html>
