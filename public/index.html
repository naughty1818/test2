<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="ClipNest — বাংলা ভিডিও, নিজের ভাষায়, নিজের মানুষের কাছে।">
  <title>ClipNest · বাংলা ভিডিও</title>
  <link rel="icon" href="/clipnest-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/clipnest.css">
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <button class="icon-button mobile-menu-trigger" id="mobileToggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="মেনু খুলুন">☰</button>
      <a href="/" data-route class="brand-lockup" aria-label="ClipNest হোম">
        <span class="brand-icon"><span class="play-glyph" aria-hidden="true"></span></span>
        <span class="brand-word">clip<span>nest</span></span>
      </a>
      <form class="top-search" id="searchForm" role="search">
        <span aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" placeholder="ভিডিও, চ্যানেল খুঁজে দেখো" aria-label="ভিডিও খুঁজুন" autocomplete="off">
        <button type="submit" aria-label="সার্চ করো">⌕</button>
      </form>
      <div class="top-actions">
        <a href="/upload" data-route class="upload-link"><span aria-hidden="true">＋</span><span>আপলোড</span></a>
        <div id="accountArea"></div>
      </div>
    </header>
    <div class="page-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-label">দেখো</div>
        <nav aria-label="প্রধান নেভিগেশন">
          <a href="/" data-route data-nav="home" class="nav-item"><span aria-hidden="true">⌂</span><span>হোম</span></a>
          <a href="/search" data-route data-nav="search" class="nav-item"><span aria-hidden="true">⌕</span><span>খুঁজে দেখো</span></a>
          <a href="/channels" data-route data-nav="channels" class="nav-item"><span aria-hidden="true">▤</span><span>চ্যানেল</span></a>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="sidebar-label">তোমার জায়গা</div>
        <a href="/channel/me" data-route data-nav="my-channel" class="nav-item"><span aria-hidden="true">♡</span><span>আমার চ্যানেল</span></a>
        <a href="/upload" data-route data-nav="upload" class="nav-item"><span aria-hidden="true">↑</span><span>ভিডিও আপলোড</span></a>
        <div class="sidebar-note">
          <div class="sidebar-note-icon"><span aria-hidden="true">▷</span></div>
          <p>তোমার গল্প, তোমার কণ্ঠে।</p>
          <span>বাংলা ভিডিওর নতুন ঠিকানা</span>
        </div>
        <div class="sidebar-footer">© ২০২৬ ClipNest · নিজের মতো দেখো</div>
      </aside>
      <main class="main-content" id="app" tabindex="-1"></main>
    </div>
    <nav class="mobile-bottom-nav" aria-label="মোবাইল নেভিগেশন">
      <a href="/" data-route data-mobile-nav="home"><span>⌂</span><span>হোম</span></a>
      <a href="/search" data-route data-mobile-nav="search"><span>⌕</span><span>খুঁজে দেখো</span></a>
      <a href="/upload" data-route data-mobile-nav="upload"><span class="mobile-upload">＋</span><span>আপলোড</span></a>
      <a href="/channel/me" data-route data-mobile-nav="channel"><span>♡</span><span>চ্যানেল</span></a>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  const app = document.getElementById('app');
  const accountArea = document.getElementById('accountArea');
  const sidebar = document.getElementById('sidebar');
  const mobileToggle = document.getElementById('mobileToggle');
  const searchForm = document.getElementById('searchForm');
  const globalSearch = document.getElementById('globalSearch');
  const toast = document.getElementById('toast');
  const state = {
    config: { maxFileMb: 500, googleLoginEnabled: false },
    session: { user: null, profile: null },
    category: '', query: '', routeToken: 0, toastTimer: null
  };
  const categories = [
    { value: '', label: 'সব ভিডিও' },
    { value: 'ভ্রমণ', label: 'ভ্রমণ' }, { value: 'রান্না', label: 'রান্না' },
    { value: 'ক্রিয়েটর', label: 'ক্রিয়েটর' }, { value: 'গল্প', label: 'গল্প' },
    { value: 'শেখা', label: 'শেখা' }, { value: 'অন্যান্য', label: 'অন্যান্য' }
  ];
  const thumbnailByCategory = {
    'ভ্রমণ': '/assets/clipnest-sylhet-hills.webp',
    'রান্না': '/assets/clipnest-khichuri.webp',
    'ক্রিয়েটর': '/assets/clipnest-creator-studio.webp',
    'গল্প': '/assets/clipnest-river-boat.webp',
    'শেখা': '/assets/clipnest-creator-studio.webp',
    'অন্যান্য': '/assets/clipnest-river-boat.webp'
  };
  const avatarColors = ['#e97855', '#ce825c', '#536f8e', '#5f8c70'];
  function $(tag, props = {}, children = []) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else if (key === 'htmlFor') el.htmlFor = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
      else if (key === 'value') el.value = value;
      else if (key === 'checked') { el.checked = Boolean(value); el.defaultChecked = Boolean(value); }
      else if (key === 'hidden') el.hidden = Boolean(value);
      else if (key === 'style' && typeof value === 'object') Object.assign(el.style, value);
      else el.setAttribute(key, value);
    }
    for (const child of children || []) if (child) el.append(child);
    return el;
  }
  const text = (value, fallback = '') => value === null || value === undefined ? fallback : String(value);
  const escapePath = value => encodeURIComponent(text(value));
  const initials = value => text(value, 'C').trim().slice(0, 1).toLocaleUpperCase('bn-BD') || 'C';
  const number = value => (Number(value) || 0).toLocaleString('bn-BD');
  const fmtSize = bytes => {
    const n = Number(bytes) || 0;
    if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return Math.round(n / 1024) + ' KB';
    return n + ' B';
  };
  const fmtDate = date => {
    if (!date) return 'তারিখ অজানা';
    try { return new Intl.DateTimeFormat('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(date)); }
    catch (_) { return text(date); }
  };
  const getName = (profile, user) => text(profile && profile.displayName, text(user && (user.name || user.email), 'ভিডিও নির্মাতা'));
  const getHandle = (profile, user) => text(profile && profile.handle, text(user && (user.handle || user.name), 'member')).replace(/^@/, '');
  const thumbFor = category => thumbnailByCategory[category] || thumbnailByCategory['অন্যান্য'];
  function notify(message, kind = '') {
    toast.textContent = message;
    toast.className = 'toast show' + (kind === 'error' ? ' toast-error' : '');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => { toast.className = 'toast'; }, 3600);
  }
  async function jsonFetch(url, options = {}) {
    const opts = { credentials: 'same-origin', ...options, headers: { Accept: 'application/json', ...(options.headers || {}) } };
    if (opts.body && typeof opts.body !== 'string') { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.body); }
    const response = await fetch(url, opts);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(text(data.error, text(data.message, 'অনুরোধটি সম্পন্ন করা যায়নি।')));
      error.status = response.status;
      throw error;
    }
    return data;
  }
  function button(label, cls = '', handler = null) {
    return $('button', { type: 'button', class: cls, text: label, ...(handler ? { onClick: handler } : {}) });
  }
  function linkButton(label, path, cls = 'primary-cta') {
    return $('a', { href: path, 'data-route': '', class: cls, text: label });
  }
  function setPage(children) { app.replaceChildren(...children); app.focus({ preventScroll: true }); }
  function loadingPage(message = 'লোড হচ্ছে…') {
    setPage([$ ('div', { class: 'empty-state' }, [$('span', { class: 'empty-state-icon', text: '…' }), $('h3', { text: message })])]);
  }
  function closeMobile() { sidebar.classList.remove('sidebar-open'); mobileToggle.setAttribute('aria-expanded', 'false'); }
  function navigate(path) {
    state.routeToken++;
    if (location.pathname + location.search !== path) history.pushState({}, '', path);
    closeMobile();
    renderRoute();
  }
  function updateNav(path) {
    document.querySelectorAll('[data-nav]').forEach(link => {
      const target = link.dataset.nav;
      const active = target === 'home' ? path === '/' : target === 'search' ? path.startsWith('/search') : target === 'upload' ? path === '/upload' : target === 'channels' ? path.startsWith('/channels') || (path.startsWith('/channel/') && path !== '/channel/me') : target === 'my-channel' ? path.startsWith('/channel/') : false;
      link.classList.toggle('nav-item-active', active);
    });
    document.querySelectorAll('[data-mobile-nav]').forEach(link => {
      const target = link.dataset.mobileNav;
      const active = target === 'home' ? path === '/' : target === 'search' ? path.startsWith('/search') : target === 'upload' ? path === '/upload' : target === 'channel' ? path.startsWith('/channel/') : false;
      link.classList.toggle('mobile-nav-active', active);
    });
  }
  function renderAccount() {
    accountArea.replaceChildren();
    if (!state.session.user) {
      const login = button('লগইন', 'login-button', () => {
        if (state.config.googleLoginEnabled) location.href = '/auth/google';
        else notify('Google OAuth hosting-এ সেটআপ করা হয়নি।', 'error');
      });
      login.setAttribute('aria-label', 'Google দিয়ে লগইন');
      if (!state.config.googleLoginEnabled) login.title = 'Google OAuth credentials configure করা নেই';
      accountArea.append(login);
      return;
    }
    const profile = state.session.profile;
    const name = getName(profile, state.session.user);
    const avatar = $('span', { class: 'user-avatar', text: initials(name) });
    const toggle = $('button', { type: 'button', class: 'account-toggle', 'aria-expanded': 'false', 'aria-label': 'অ্যাকাউন্ট মেনু' }, [avatar, $('span', { class: 'account-name', text: name }), $('span', { class: 'chevron', text: '⌄' })]);
    const menu = $('div', { class: 'account-menu' });
    menu.append($('div', { class: 'menu-note', text: name }));
    menu.append($('a', { href: '/channel/me', 'data-route': '', text: 'আমার চ্যানেল' }));
    menu.append($('a', { href: '/upload', 'data-route': '', text: 'ভিডিও আপলোড' }));
    menu.append($('button', { type: 'button', class: 'logout-item', text: 'লগআউট', onClick: async () => {
      try { await jsonFetch('/auth/logout', { method: 'POST', body: {} }); state.session = { user: null, profile: null }; renderAccount(); notify('লগআউট হয়েছে।'); renderRoute(); }
      catch (error) { notify(error.message, 'error'); }
    } }));
    toggle.addEventListener('click', () => { const open = menu.classList.toggle('open'); toggle.setAttribute('aria-expanded', String(open)); });
    accountArea.append($('div', { class: 'account-wrap' }, [toggle, menu]));
  }
  function emptyState(title, description, ctaText = '', href = '/') {
    const box = $('div', { class: 'empty-state' });
    box.append($('span', { class: 'empty-state-icon', text: '✳' }), $('h3', { text: title }), $('p', { text: description }));
    if (ctaText) box.append(linkButton(ctaText, href, 'text-link'));
    return box;
  }
  function categoryChips(active, onChoose, className = 'category-strip') {
    const strip = $('div', { class: className, role: 'tablist', 'aria-label': 'ভিডিও বিভাগ' });
    categories.forEach(item => {
      const chip = button(item.label, 'category-chip' + (active === item.value ? ' category-chip-active' : ''), () => onChoose(item.value));
      chip.setAttribute('role', 'tab');
      chip.setAttribute('aria-selected', String(active === item.value));
      strip.append(chip);
    });
    return strip;
  }
  function videoCard(video, featured = false) {
    const card = $('article', { class: 'video-card' + (featured ? ' video-card-featured' : '') });
    const thumbLink = $('a', { href: '/watch/' + escapePath(video.id), 'data-route': '', class: 'video-thumb-link', 'aria-label': text(video.title, 'ভিডিও দেখো') });
    const thumb = $('div', { class: 'video-thumb', style: { '--thumb-accent': avatarColors[Math.abs(text(video.category).length) % avatarColors.length] } });
    const img = $('img', { src: thumbFor(video.category), alt: '', loading: 'lazy' });
    img.addEventListener('error', () => { img.remove(); });
    thumb.append(img, $('span', { class: 'thumb-overlay' }), $('span', { class: 'thumb-play' }, [$('span', { class: 'play-glyph' })]), $('span', { class: 'video-duration', text: fmtSize(video.size) }));
    thumbLink.append(thumb);
    const body = $('div', { class: 'video-card-body' });
    const ownerName = text(video.ownerName, 'ClipNest নির্মাতা');
    const ownerHandle = text(video.ownerHandle, '');
    const avatar = $('a', { href: ownerHandle ? '/channel/' + escapePath(ownerHandle) : '/channel/me', 'data-route': '', class: 'creator-avatar', style: { background: avatarColors[Math.abs(ownerName.length) % avatarColors.length] }, text: initials(ownerName), 'aria-label': ownerName });
    const copy = $('div', { class: 'video-copy' });
    copy.append($('a', { href: '/watch/' + escapePath(video.id), 'data-route': '', class: 'video-title', text: text(video.title, 'শিরোনামহীন ভিডিও') }));
    copy.append($('a', { href: ownerHandle ? '/channel/' + escapePath(ownerHandle) : '/channel/me', 'data-route': '', class: 'creator-name', text: ownerName }));
    const meta = $('div', { class: 'video-meta' });
    meta.append($('span', { text: number(video.viewsCount) + ' ভিউ' }), $('span', { class: 'meta-dot' }), $('span', { text: fmtDate(video.created) }));
    copy.append(meta);
    const actions = $('div', { class: 'card-actions' });
    const liked = Boolean(video.liked);
    const likeButton = $('button', { type: 'button', class: 'card-icon' + (liked ? ' card-icon-liked' : ''), 'aria-label': 'লাইক দাও' });
    likeButton.append($('span', { class: 'heart-icon', text: liked ? '♥' : '♡' }), $('span', { class: 'card-like-count', text: number(video.likesCount) }));
    likeButton.addEventListener('click', async event => {
      event.preventDefault(); event.stopPropagation();
      if (!state.session.user) { notify('লাইক দিতে আগে Google দিয়ে লগইন করো।'); navigate('/login'); return; }
      likeButton.disabled = true;
      try {
        const result = await jsonFetch('/api/videos/' + encodeURIComponent(video.id) + '/like', { method: 'POST', body: {} });
        video.liked = result.liked; video.likesCount = result.likesCount;
        likeButton.classList.toggle('card-icon-liked', result.liked);
        likeButton.querySelector('.heart-icon').textContent = result.liked ? '♥' : '♡';
        likeButton.querySelector('.card-like-count').textContent = number(result.likesCount);
        likeButton.setAttribute('aria-label', result.liked ? 'লাইক সরাও' : 'লাইক দাও');
      } catch (error) { notify(error.message, 'error'); }
      finally { likeButton.disabled = false; }
    });
    actions.append(likeButton);
    body.append(avatar, copy, actions);
    card.append(thumbLink, body);
    return card;
  }
  function videoGrid(videos, message = 'এখনো কোনো প্রকাশিত ভিডিও নেই।') {
    const grid = $('div', { class: 'video-grid' });
    if (!Array.isArray(videos) || !videos.length) { grid.append(emptyState(message, 'নতুন ভিডিও যোগ হলে এখানে দেখা যাবে।', state.session.user ? 'ভিডিও আপলোড করো' : 'লগইন করে আপলোড করো', state.session.user ? '/upload' : '/login')); return grid; }
    videos.forEach((video, index) => grid.append(videoCard(video, index === 0 && !state.category)));
    return grid;
  }
  function queryUrl(query = state.query, category = state.category, offset = 0, limit = 24) {
    const params = new URLSearchParams({ limit: String(limit), offset: String(offset) });
    if (query) params.set('query', query);
    if (category) params.set('category', category);
    return '/api/videos?' + params.toString();
  }
  function heroPanel(featured) {
    const section = $('section', { class: 'hero-panel' });
    const img = $('img', { class: 'hero-image', src: featured ? thumbFor(featured.category) : '/assets/clipnest-river-boat.webp', alt: '', fetchpriority: 'high' });
    img.addEventListener('error', () => { img.remove(); });
    section.append(img, $('div', { class: 'hero-shade' }));
    const copy = $('div', { class: 'hero-copy' });
    copy.append($('span', { class: 'hero-eyebrow', text: '✦ বাংলা ভিডিও, তোমার মতো' }), $('h1', {}, [$('span', { text: 'আজ কী' }), document.createElement('br'), $('em', { text: 'দেখবে?' })]), $('p', { text: 'গল্প, রান্না, ভ্রমণ—নিজের ভাষায়, নিজের মানুষের কাছে।' }));
    copy.append(linkButton(featured ? '▷  ভিডিও দেখো  ↗' : '⌕  খুঁজে দেখো  ↗', featured ? '/watch/' + escapePath(featured.id) : '/search', 'hero-cta'));
    const caption = $('div', { class: 'hero-caption' });
    caption.append($('span', { class: 'hero-caption-kicker', text: featured ? 'সাম্প্রতিক public video' : 'ClipNest · বাংলা ভিডিও' }), $('strong', { text: featured ? text(featured.title, 'নতুন ভিডিও') : 'নিজের গল্প, নিজের ভাষায়' }), $('span', { text: featured ? text(featured.ownerName, 'ClipNest নির্মাতা') + ' · ' + number(featured.viewsCount) + ' ভিউ' : 'তোমার দেখা শুরু হোক এখান থেকেই' }));
    section.append(copy, caption, $('div', { class: 'hero-progress' }, [$('span')]));
    return section;
  }
  function creatorCallout() {
    const section = $('section', { class: 'creator-callout' });
    section.append($('div', { class: 'creator-callout-mark', text: '▷' }), $('div', {}, [
      $('span', { class: 'section-kicker', text: 'তুমি কি নির্মাতা?' }),
      $('h3', { text: 'তোমার ভিডিওর জন্যও এখানে জায়গা আছে' }),
      $('p', { text: 'নিজের গল্প শেয়ার করো, তোমার মতো দর্শকের কাছে পৌঁছে দাও।' })
    ]), linkButton('ভিডিও আপলোড  ↗', '/upload', 'outline-cta'));
    return section;
  }
  async function renderHome(token) {
    updateNav('/');
    const feed = $('section', { class: 'feed-section' });
    const heading = $('div', { class: 'feed-heading' }, [
      $('div', {}, [$('span', { class: 'section-kicker', text: 'তোমার জন্য' }), $('h2', { text: 'আজকের ভিডিও' })]),
      linkButton('সব দেখো  ↗', '/search', 'see-all')
    ]);
    const chips = categoryChips(state.category, value => { state.category = value; renderRoute(); });
    const grid = $('div', { class: 'video-grid' }, [emptyState('ভিডিও খুঁজছি…', 'একটু অপেক্ষা করো।')]);
    feed.append(heading, chips, grid);
    setPage([heroPanel(null), feed, creatorCallout()]);
    try {
      const data = await jsonFetch(queryUrl('', state.category, 0, 24));
      if (token !== state.routeToken) return;
      const videos = data.videos || [];
      app.replaceChildren(heroPanel(videos[0] || null), feed, creatorCallout());
      chips.replaceWith(categoryChips(state.category, value => { state.category = value; renderRoute(); }));
      const nextGrid = videoGrid(videos, 'এখনো কোনো public video নেই। প্রথম ভিডিওটি তোমার হতে পারে।');
      grid.replaceWith(nextGrid);
      if (data.hasMore) appendLoadMore(feed, nextGrid, '', state.category, 24, token);
    } catch (error) {
      if (token === state.routeToken) grid.replaceWith(emptyState('ভিডিও লোড করা যায়নি', error.message, 'আবার চেষ্টা করো', '/'));
    }
  }
  function appendLoadMore(section, grid, query, category, offset, token) {
    const more = button('আরও ভিডিও দেখো', 'outline-cta');
    more.style.margin = '22px auto 0'; more.style.display = 'flex';
    more.addEventListener('click', async () => {
      more.disabled = true;
      try {
        const data = await jsonFetch(queryUrl(query, category, offset, 24));
        if (token !== state.routeToken) return;

      channelActions.append(button('↗', 'action-pill icon-only', async () => { try { await navigator.clipboard.writeText(location.href); notify('চ্যানেলের লিংক কপি হয়েছে।'); } catch (_) { notify('লিংক কপি করা যায়নি।', 'error'); } }));
      profileSection.append(channelActions);
      page.append(cover, profileSection);
      if (own) {
        const edit = $('form', { class: 'profile-edit-panel', id: 'profileEdit', hidden: true });
        edit.append($('div', { class: 'profile-edit-title' }, [$('strong', { text: 'চ্যানেল পরিচিতি' }), $('span', { text: 'ClipNest profile' })]));
        const nameInput = $('input', { type: 'text', maxlength: '120', required: '', value: text(profile.displayName, '') });
        const handleInput = $('input', { type: 'text', maxlength: '30', minlength: '3', required: '', value: text(profile.handle, '') });
        const bioInput = $('textarea', { maxlength: '1000', rows: '3', placeholder: 'তোমার চ্যানেল নিয়ে কয়েকটি কথা' }); bioInput.value = text(profile.bio, '');
        edit.append($('label', { class: 'form-field' }, [$('span', { text: 'চ্যানেল নাম' }), nameInput]), $('label', { class: 'form-field' }, [$('span', { text: 'চ্যানেল handle' }), handleInput, $('small', { text: '৩–৩০ অক্ষর; ইংরেজি অক্ষর, সংখ্যা, dot, dash বা underscore' })]), $('label', { class: 'form-field' }, [$('span', { text: 'পরিচিতি' }), bioInput]));
        const formNotice = $('p', { class: 'inline-error', hidden: true });
        const actions = $('div', { class: 'profile-edit-actions' }, [button('বাতিল', 'outline-cta', () => { edit.hidden = true; }), $('button', { type: 'submit', class: 'primary-cta', text: 'পরিবর্তন সেভ' })]);
        edit.append(formNotice, actions);
        edit.addEventListener('submit', async event => {
          event.preventDefault();
          const save = actions.querySelector('[type="submit"]'); save.disabled = true; formNotice.hidden = true;
          try {
            const result = await jsonFetch('/api/me/profile', { method: 'POST', body: { displayName: nameInput.value.trim(), handle: handleInput.value.trim(), bio: bioInput.value.trim() } });
            state.session.profile = result.profile; renderAccount(); notify('চ্যানেল প্রোফাইল আপডেট হয়েছে।'); navigate('/channel/' + escapePath(result.profile.handle));
          } catch (error) { formNotice.textContent = error.message; formNotice.hidden = false; }
          finally { save.disabled = false; }
        });
        page.append(edit);
      }
      const tabs = $('div', { class: 'channel-tabs' }, [
        $('button', { type: 'button', class: 'channel-tab-active', text: '▤  ভিডিও' }),
        $('button', { type: 'button', class: 'channel-tab', text: 'সম্পর্কে' }),
        linkButton('ভিডিও যোগ করো  ↗', '/upload', 'channel-upload-link')
      ]);
      page.append(tabs, videoGrid(videos, 'এখনো কোনো প্রকাশিত ভিডিও নেই।'));
      setPage([page]);
    } catch (error) {
      if (token === state.routeToken) setPage([emptyState('চ্যানেলটি পাওয়া যায়নি', error.message, 'হোমে ফিরে যাও', '/')]);
    }
  }
  async function renderChannels(token) {
    updateNav('/channels'); loadingPage('চ্যানেল খুঁজছি…');
    try {
      const data = await jsonFetch(queryUrl('', '', 0, 100));
      if (token !== state.routeToken) return;
      const channels = new Map();
      for (const video of data.videos || []) {
        if (!video.ownerHandle) continue;
        const key = video.ownerHandle.toLowerCase();
        if (!channels.has(key)) channels.set(key, { handle: video.ownerHandle, name: video.ownerName || 'ClipNest নির্মাতা', count: 0, latest: video.created, category: video.category });
        channels.get(key).count++;
      }
      const page = $('section');
      page.append($('div', { class: 'page-heading' }, [
        $('div', {}, [$('span', { class: 'section-kicker', text: 'আবিষ্কার' }), $('h1', { text: 'চ্যানেল খুঁজে দেখো' }), $('p', { text: 'বাংলা ভিডিও নির্মাতাদের প্রকাশিত গল্প এক জায়গায়।' })])
      ]));
      const grid = $('div', { class: 'channels-grid' });
      if (!channels.size) grid.append(emptyState('এখনো কোনো channel নেই', 'নির্মাতারা public video প্রকাশ করলে channel এখানে দেখা যাবে।', state.session.user ? 'ভিডিও আপলোড করো' : 'লগইন করো', state.session.user ? '/upload' : '/login'));
      else for (const channel of channels.values()) {
        const card = $('a', { href: '/channel/' + escapePath(channel.handle), 'data-route': '', class: 'channel-discovery-card' });
        card.append($('span', { class: 'channel-avatar', style: { background: avatarColors[Math.abs(channel.name.length) % avatarColors.length] }, text: initials(channel.name) }),
          $('div', { class: 'channel-discovery-copy' }, [$('h3', { text: channel.name }), $('span', { text: '@' + channel.handle }), $('small', { text: number(channel.count) + 'টি public video · ' + text(channel.category, 'ClipNest') })]),
          $('span', { class: 'channel-discovery-arrow', text: '↗' }));
        grid.append(card);
      }
      page.append(grid); setPage([page]);
    } catch (error) { if (token === state.routeToken) setPage([emptyState('চ্যানেল লোড করা যায়নি', error.message, 'হোমে ফিরে যাও', '/')]); }
  }
  function renderNotFound() {
    setPage([emptyState('এই পেজটি পাওয়া যায়নি', 'লিংকটি পরীক্ষা করে আবার চেষ্টা করো।', 'ClipNest হোম', '/')]);
  }
  async function renderRoute() {
    const token = ++state.routeToken;
    const path = location.pathname.replace(/\/+$/, '') || '/';
    document.title = path === '/upload' ? 'ভিডিও আপলোড · ClipNest' : path === '/login' ? 'লগইন · ClipNest' : path === '/channels' ? 'চ্যানেল খুঁজে দেখো · ClipNest' : path.startsWith('/watch/') ? 'ভিডিও · ClipNest' : path.startsWith('/channel/') ? 'চ্যানেল · ClipNest' : path === '/search' ? 'খুঁজে দেখো · ClipNest' : 'ClipNest · বাংলা ভিডিও';
    updateNav(path);
    if (path === '/') return renderHome(token);
    if (path === '/search') return renderSearch(token);
    if (path === '/channels') return renderChannels(token);
    if (path === '/upload') return renderUpload(token);
    if (path === '/login') return renderLogin();
    const watch = path.match(/^\/watch\/([^/]+)$/);
    if (watch) return renderWatch(decodeURIComponent(watch[1]), token);
    const channel = path.match(/^\/channel\/([^/]+)$/);
    if (channel) return renderChannel(decodeURIComponent(channel[1]), token);
    return renderNotFound();
  }
  document.addEventListener('click', event => {
    const link = event.target.closest && event.target.closest('a[data-route]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const url = new URL(link.href, location.origin);
    if (url.origin !== location.origin) return;
    event.preventDefault(); navigate(url.pathname + url.search);
  });
  searchForm.addEventListener('submit', event => {
    event.preventDefault(); state.query = globalSearch.value.trim(); state.category = '';
    navigate('/search' + (state.query ? '?q=' + encodeURIComponent(state.query) : ''));
  });
  mobileToggle.addEventListener('click', () => {
    const open = sidebar.classList.toggle('sidebar-open');
    mobileToggle.setAttribute('aria-expanded', String(open));
  });
  window.addEventListener('popstate', renderRoute);
  async function boot() {
    try { state.config = { ...state.config, ...await jsonFetch('/api/config') }; } catch (_) {}
    try { state.session = await jsonFetch('/auth/me'); } catch (_) { state.session = { user: null, profile: null }; }
    renderAccount(); await renderRoute();
  }
  boot();
  </script>
</body>
</html>
