<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Hub</title>
<style>
  :root {
    --bg: #0f0f10; --panel: #1a1a1c; --panel-2: #232326; --text: #f1f1f1;
    --muted: #a0a0a8; --accent: #ff4e45; --ok: #3ecf8e; --err: #ff6b6b; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f6f7; --panel:#fff; --panel-2:#efeff1; --text:#16161a; --muted:#6b6b76; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--panel-2); background: var(--panel);
    position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  section { margin-bottom: 40px; }
  h2 { font-size: 18px; margin: 0 0 14px; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 20px; }
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  input[type=text], input[type=password], textarea {
    background: var(--panel-2); border: 1px solid transparent; color: var(--text);
    border-radius: 8px; padding: 10px 12px; font: inherit; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 80px; resize: vertical; }
  .drop { border: 2px dashed var(--panel-2); border-radius: var(--radius); padding: 28px;
    text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); background: var(--panel-2); }
  .drop strong { color: var(--text); word-break: break-all; }
  .drop input { display: none; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .progress { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
  #status { font-size: 14px; min-height: 22px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .video { background: var(--panel); border-radius: var(--radius); overflow: hidden; }
  .video video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; }
  .video .meta { padding: 12px 14px 14px; }
  .video h3 { margin: 0 0 4px; font-size: 15px; line-height: 1.35; word-break: break-word; }
  .video p { margin: 0; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header><h1>Video<span>Hub</span></h1></header>

<main>
  <section>
    <h2>Video upload koro</h2>
    <div class="card">
      <form id="uploadForm">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="video/*" required>
          <div id="dropText"><strong>Video file select koro</strong> ba ekhane drag &amp; drop koro</div>
        </label>
        <label>Title
          <input type="text" id="title" maxlength="100" placeholder="Video er naam">
        </label>
        <label>Description
          <textarea id="description" maxlength="5000" placeholder="Optional"></textarea>
        </label>
        <label>Upload password
          <input type="password" id="password" required autocomplete="current-password">
        </label>
        <div class="progress" id="progress"><div id="bar"></div></div>
        <div id="status"></div>
        <div><button type="submit" id="submitBtn">Upload</button></div>
      </form>
    </div>
  </section>

  <section>
    <h2>Videos</h2>
    <div class="grid" id="videos"><p class="empty">Loading...</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $('uploadForm'), fileInput = $('file'), drop = $('drop');
let maxFileMb = 500;

function fmtSize(b) { return b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(1) + ' MB'; }
function setStatus(text, cls = '') { const s = $('status'); s.textContent = text; s.className = cls; }

fetch('/api/config').then((r) => r.json()).then((c) => { maxFileMb = c.maxFileMb; }).catch(() => {});
try { $('password').value = sessionStorage.getItem('pw') || ''; } catch {}

// ---- file select / drag & drop ----
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  $('dropText').innerHTML = '<strong></strong> · ' + fmtSize(f.size);
  $('dropText').querySelector('strong').textContent = f.name;
  if (!$('title').value) $('title').value = f.name.replace(/\.[^.]+$/, '');
});
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => {
  if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); }
});

// ---- helpers ----
async function api(path, password, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-app-password': password },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request fail hoyeche (' + res.status + ')');
  return data;
}

function putToStorage(url, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    xhr.setRequestHeader('Content-Type', file.type);
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
      ? resolve()
      : reject(new Error('R2 upload fail (' + xhr.status + '). Bucket er CORS setting ta check koro.'));
    xhr.onerror = () => reject(new Error('Network/CORS error. README er CORS step ta kora hoyeche to?'));
    xhr.send(file);
  });
}

// ---- upload flow ----
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = fileInput.files[0];
  const password = $('password').value;
  if (!f) return;
  if (!f.type.startsWith('video/')) return setStatus('Eta video file na, ba browser format ta chine na.', 'err');
  if (f.size > maxFileMb * 1024 * 1024) return setStatus('File ' + maxFileMb + 'MB er beshi hoite parbe na.', 'err');

  $('submitBtn').disabled = true;
  $('progress').style.display = 'block';
  $('bar').style.width = '0';
  try {
    setStatus('Upload link nichhi...');
    const { uploadUrl, objectName } = await api('/api/upload-url', password, {
      filename: f.name, contentType: f.type, size: f.size
    });
    try { sessionStorage.setItem('pw', password); } catch {}

    await putToStorage(uploadUrl, f, (pct) => {
      $('bar').style.width = pct + '%';
      setStatus('Upload hocche... ' + pct + '%');
    });

    setStatus('Shesh kortechi...');
    await api('/api/finish', password, {
      objectName, title: $('title').value || f.name, description: $('description').value
    });

    setStatus('Upload hoye geche ✔', 'ok');
    form.reset();
    $('password').value = password;
    $('dropText').innerHTML = '<strong>Video file select koro</strong> ba ekhane drag &amp; drop koro';
    loadVideos();
  } catch (err) {
    setStatus(err.message, 'err');
  } finally {
    $('submitBtn').disabled = false;
    $('progress').style.display = 'none';
  }
});

// ---- video list ----
async function loadVideos() {
  const box = $('videos');
  try {
    const res = await fetch('/api/videos');
    const list = await res.json();
    if (!res.ok) throw new Error(list.error || 'Load kora jay nai');
    if (!list.length) { box.innerHTML = '<p class="empty">Ekhono kono video nai.</p>'; return; }
    box.innerHTML = '';
    for (const v of list) {
      const el = document.createElement('article');
      el.className = 'video';
      el.innerHTML = '<video controls preload="metadata"></video><div class="meta"><h3></h3><p></p></div>';
      el.querySelector('video').src = v.url;
      el.querySelector('h3').textContent = v.title;
      el.querySelector('p').textContent = fmtSize(v.size) + ' · ' + new Date(v.created).toLocaleDateString();
      box.appendChild(el);
    }
  } catch (err) {
    box.innerHTML = '<p class="empty"></p>';
    box.firstChild.textContent = 'Videos load hoy nai: ' + err.message;
  }
}
loadVideos();
</script>
</body>
</html>
