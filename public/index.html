<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111820">
  <title>আড্ডা ভিডিও · আপনার ভিডিও হাব</title>
  <style>
    :root {
      --bg: #0b1117;
      --bg-soft: #101a22;
      --surface: #15222c;
      --surface-2: #1c2c37;
      --surface-3: #233642;
      --line: rgba(210, 231, 239, .13);
      --text: #edf7f8;
      --muted: #9bb0b8;
      --accent: #57d6b0;
      --accent-strong: #2bbf97;
      --accent-ink: #072a22;
      --yellow: #ffd36a;
      --danger: #ff8c8c;
      --shadow: 0 18px 50px rgba(0,0,0,.22);
      --radius: 18px;
      --max: 1180px;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f4f8f8; --bg-soft:#eef4f3; --surface:#fff; --surface-2:#edf4f3; --surface-3:#e2eeeb; --line:rgba(16,43,48,.14); --text:#122329; --muted:#597079; --shadow:0 16px 40px rgba(42,72,75,.12); }
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:radial-gradient(circle at 76% -10%, rgba(71,150,145,.18), transparent 30rem), var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif; min-height:100vh; }
    a { color:inherit; text-decoration:none; }
    button, input, textarea, select { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    :focus-visible { outline:3px solid var(--yellow); outline-offset:3px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .shell { max-width:var(--max); margin:auto; padding:0 22px; }
    .topbar { position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(18px); }
    .topbar-inner { height:76px; display:flex; align-items:center; gap:22px; }
    .brand { display:inline-flex; align-items:center; gap:11px; font-size:1.2rem; font-weight:850; letter-spacing:-.03em; white-space:nowrap; }
    .brand-mark { width:36px; height:36px; border-radius:12px 12px 12px 4px; display:grid; place-items:center; color:var(--accent-ink); background:var(--accent); font-size:1rem; box-shadow:0 7px 18px rgba(87,214,176,.25); }
    .brand em { color:var(--accent); font-style:normal; }
    .main-nav { display:flex; align-items:center; gap:4px; }
    .nav-link { color:var(--muted); font-size:.94rem; padding:9px 12px; border-radius:10px; }
    .nav-link:hover, .nav-link.active { color:var(--text); background:var(--surface-2); }
    .searchbar { flex:1; max-width:410px; margin-left:auto; position:relative; }
    .searchbar input { width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:999px; padding:11px 44px 11px 18px; }
    .searchbar button { position:absolute; right:5px; top:5px; border:0; border-radius:50%; width:34px; height:34px; background:var(--surface-3); color:var(--text); }
    .account { position:relative; }
    .account-toggle { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:999px; padding:6px 12px 6px 6px; }
    .avatar { width:30px; height:30px; display:inline-grid; place-items:center; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:.78rem; font-weight:850; }
    .menu { display:none; position:absolute; right:0; top:calc(100% + 10px); min-width:220px; padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
    .menu.open { display:block; }
    .menu button, .menu a { display:block; width:100%; border:0; background:transparent; color:var(--text); text-align:left; border-radius:9px; padding:10px 12px; }
    .menu button:hover, .menu a:hover { background:var(--surface-2); }
    .menu .menu-note { padding:8px 12px 6px; color:var(--muted); font-size:.82rem; border-bottom:1px solid var(--line); margin-bottom:4px; }
    .mobile-toggle { display:none; border:0; border-radius:9px; background:var(--surface-2); color:var(--text); padding:9px 11px; }
    main { min-height:calc(100vh - 76px); padding:42px 0 80px; }
    .hero { display:grid; grid-template-columns:1.15fr .85fr; gap:34px; align-items:center; padding:28px 0 44px; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; color:var(--accent); font-size:.82rem; letter-spacing:.08em; font-weight:800; text-transform:uppercase; }
    .eyebrow::before { content:""; width:24px; height:2px; background:var(--accent); }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:16px; max-width:650px; font-size:clamp(2.1rem,5vw,4.5rem); line-height:1.03; letter-spacing:-.06em; }
    h1 .highlight { color:var(--accent); }
    .hero-copy { color:var(--muted); max-width:600px; font-size:1.05rem; }
    .hero-card { position:relative; min-height:250px; border:1px solid var(--line); border-radius:28px; overflow:hidden; background:linear-gradient(135deg, var(--surface), #183d3b); box-shadow:var(--shadow); }
    .hero-card::before, .hero-card::after { content:""; position:absolute; border-radius:50%; filter:blur(2px); }
    .hero-card::before { width:210px; height:210px; background:rgba(87,214,176,.22); right:-26px; top:-38px; }
    .hero-card::after { width:135px; height:135px; background:rgba(255,211,106,.18); left:-30px; bottom:-35px; }
    .hero-spark { position:absolute; z-index:1; inset:30px; display:flex; flex-direction:column; justify-content:flex-end; }
    .hero-spark strong { font-size:1.7rem; max-width:250px; line-height:1.15; }
    .hero-spark span { margin-top:9px; color:#c9e8df; font-size:.9rem; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:18px; margin:12px 0 19px; }
    .section-head h2 { margin:0; font-size:1.4rem; letter-spacing:-.03em; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
    .filters { display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin-bottom:24px; }
    .chip { border:1px solid var(--line); color:var(--muted); background:var(--surface); padding:8px 14px; border-radius:999px; }
    .chip:hover, .chip.selected { border-color:var(--accent); color:var(--accent-ink); background:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
    .video-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.08); transition:transform .18s ease, border-color .18s ease; }
    .video-card:hover { transform:translateY(-3px); border-color:rgba(87,214,176,.5); }
    .thumb { display:flex; align-items:center; justify-content:center; aspect-ratio:16/9; background:linear-gradient(145deg,#19323c,#0d2528); position:relative; }
    .thumb::after { content:""; position:absolute; inset:14px; border:1px solid rgba(255,255,255,.08); border-radius:12px; }
    .play { width:52px; height:52px; display:grid; place-items:center; padding-left:3px; border:0; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:1.15rem; z-index:1; box-shadow:0 8px 26px rgba(0,0,0,.2); }
    .duration { position:absolute; bottom:11px; right:11px; z-index:1; border-radius:5px; padding:2px 6px; background:rgba(0,0,0,.58); color:#fff; font-size:.75rem; }
    .card-body { padding:15px 16px 17px; }
    .card-title { overflow:hidden; margin-bottom:7px; font-size:1.01rem; line-height:1.3; white-space:nowrap; text-overflow:ellipsis; }
    .card-description { min-height:24px; margin-bottom:12px; color:var(--muted); overflow:hidden; font-size:.85rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .card-meta, .channel-line { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.8rem; }
    .card-meta .dot { width:3px; height:3px; border-radius:50%; background:var(--muted); }
    .mini-avatar { width:22px; height:22px; display:inline-grid; place-items:center; flex:0 0 auto; border-radius:50%; background:var(--surface-3); color:var(--accent); font-size:.65rem; font-weight:800; }
    .empty { border:1px dashed var(--line); border-radius:var(--radius); padding:42px 22px; color:var(--muted); text-align:center; grid-column:1/-1; }
    .loading { color:var(--muted); padding:30px 0; }
    .load-more { display:block; margin:26px auto 0; }
    .btn { border:1px solid transparent; border-radius:11px; padding:10px 17px; font-weight:750; }
    .btn-primary { color:var(--accent-ink); background:var(--accent); }
    .btn-primary:hover { background:#7be2c3; }
    .btn-ghost { color:var(--text); background:var(--surface); border-color:var(--line); }
    .btn-ghost:hover { background:var(--surface-2); border-color:var(--accent); }
    .btn-danger { color:var(--danger); background:transparent; border-color:rgba(255,140,140,.4); }
    .btn-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .watch-layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(270px,.6fr); gap:28px; }
    .watch-player { width:100%; max-height:69vh; aspect-ratio:16/9; border-radius:18px; background:#000; display:block; }
    .watch-title { margin:22px 0 8px; font-size:clamp(1.45rem,3vw,2.4rem); letter-spacing:-.04em; }
    .watch-description { white-space:pre-wrap; color:var(--muted); }
    .watch-actions { display:flex; align-items:center; gap:10px; padding:14px 0 18px; border-bottom:1px solid var(--line); }
    .watch-stats { color:var(--muted); font-size:.87rem; margin-left:auto; }
    .watch-side { align-self:start; padding:22px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
    .watch-side h3 { margin-bottom:13px; font-size:1rem; }
    .watch-side p { color:var(--muted); font-size:.9rem; }
    .profile-hero { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:24px; margin-bottom:30px; border:1px solid var(--line); background:linear-gradient(120deg,var(--surface),var(--bg-soft)); border-radius:var(--radius); }
    .profile-main { display:flex; align-items:center; gap:17px; min-width:0; }
    .profile-avatar { width:74px; height:74px; display:grid; place-items:center; border-radius:22px 22px 22px 5px; background:var(--accent); color:var(--accent-ink); font-size:1.65rem; font-weight:900; }
    .profile-main h1 { margin:0 0 2px; font-size:clamp(1.45rem,4vw,2.4rem); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .handle { color:var(--accent); }
    .profile-bio { margin:7px 0 0; color:var(--muted); max-width:600px; white-space:pre-wrap; }
    .profile-edit { display:none; margin-bottom:30px; }
    .profile-edit.open { display:block; }
    .panel { padding:23px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
    .panel h2 { margin-bottom:17px; font-size:1.25rem; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .field { display:grid; gap:7px; }
    .field.full { grid-column:1/-1; }
    .field label { font-size:.88rem; font-weight:700; }
    .field small, .hint { color:var(--muted); font-size:.78rem; }
    input[type="text"], input[type="search"], textarea, select { width:100%; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
    textarea { min-height:110px; resize:vertical; }
    .upload-card { max-width:780px; margin:0 auto; }
    .dropzone { min-height:154px; display:grid; place-items:center; text-align:center; padding:25px; border:2px dashed var(--line); border-radius:15px; background:var(--bg-soft); color:var(--muted); cursor:pointer; }
    .dropzone:hover, .dropzone.over { border-color:var(--accent); background:var(--surface-2); }
    .dropzone strong { display:block; color:var(--text); margin-bottom:4px; word-break:break-word; }
    .dropzone input { position:absolute; width:1px; height:1px; opacity:0; }
    .visibility { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .visibility label { display:flex; align-items:flex-start; gap:8px; min-height:74px; padding:12px; border:1px solid var(--line); border-radius:11px; cursor:pointer; }
    .visibility label:has(input:checked) { border-color:var(--accent); background:rgba(87,214,176,.09); }
    .visibility b { display:block; font-size:.88rem; }
    .visibility span { display:block; color:var(--muted); font-size:.75rem; }
    .progress-wrap { display:none; gap:7px; color:var(--muted); font-size:.83rem; }
    .progress-wrap.show { display:grid; }
    progress { width:100%; height:9px; accent-color:var(--accent); }
    .notice { min-height:24px; color:var(--muted); font-size:.87rem; }
    .notice.ok { color:var(--accent); }
    .notice.error { color:var(--danger); }
    .auth-card { max-width:530px; margin:20px auto; padding:36px 28px; text-align:center; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); }
    .auth-card h1 { margin:0 auto 12px; font-size:2rem; }
    .auth-card p { color:var(--muted); }
    footer { border-top:1px solid var(--line); padding:24px 0 90px; color:var(--muted); font-size:.82rem; }
    .toast { position:fixed; right:20px; bottom:22px; z-index:30; max-width:min(380px,calc(100vw - 40px)); padding:13px 16px; border:1px solid var(--line); border-radius:11px; background:var(--surface); box-shadow:var(--shadow); transform:translateY(20px); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
    .toast.show { transform:translateY(0); opacity:1; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .watch-layout { grid-template-columns:1fr; } .watch-side { order:-1; } }
    @media (max-width:720px) {
      .shell { padding:0 15px; } .topbar-inner { height:66px; gap:10px; } .brand { margin-right:auto; } .main-nav { display:none; position:absolute; top:66px; left:0; right:0; padding:10px 15px; flex-direction:column; align-items:stretch; background:var(--surface); border-bottom:1px solid var(--line); } .main-nav.open { display:flex; } .mobile-toggle { display:block; } .searchbar { order:5; position:absolute; top:76px; left:15px; right:15px; max-width:none; } main { padding-top:65px; } .hero { grid-template-columns:1fr; padding-top:20px; } h1 { font-size:clamp(2.1rem,12vw,3.5rem); } .hero-card { min-height:190px; } .section-head { align-items:flex-start; flex-direction:column; gap:4px; } .grid { grid-template-columns:1fr; } .profile-hero { align-items:flex-start; flex-direction:column; } .profile-main { width:100%; } .profile-edit .form-grid, .form-grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } .visibility { grid-template-columns:1fr; } .watch-actions { flex-wrap:wrap; } .watch-stats { width:100%; margin-left:0; } footer { padding-bottom:110px; }
    }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important; } .video-card:hover { transform:none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/" data-route aria-label="আড্ডা ভিডিও হোম"><span class="brand-mark" aria-hidden="true">▶</span><span>আড্ডা <em>ভিডিও</em></span></a>
      <nav class="main-nav" id="mainNav" aria-label="প্রধান নেভিগেশন">
        <a class="nav-link" href="/" data-route data-nav="home">হোম</a>
        <a class="nav-link" href="/upload" data-route data-nav="upload">আপলোড</a>
      </nav>
      <form class="searchbar" id="searchForm" role="search">
        <label class="sr-only" for="globalSearch">ভিডিও খুঁজুন</label>
        <input id="globalSearch" type="search" placeholder="ভিডিও খুঁজুন…" autocomplete="off">
        <button type="submit" aria-label="খুঁজুন">⌕</button>
      </form>
      <button class="mobile-toggle" id="mobileToggle" aria-expanded="false" aria-controls="mainNav" aria-label="মেনু খুলুন">☰</button>
      <div class="account" id="accountArea"></div>
    </div>
  </header>
  <main id="app" class="shell" tabindex="-1"></main>
  <footer><div class="shell">আপনার গল্প, আপনার কণ্ঠ—নিরাপদে শেয়ার করুন। · আড্ডা ভিডিও</div></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';
    const app = document.getElementById('app');
    const accountArea = document.getElementById('accountArea');
    const mainNav = document.getElementById('mainNav');
    const mobileToggle = document.getElementById('mobileToggle');
    const searchForm = document.getElementById('searchForm');
    const globalSearch = document.getElementById('globalSearch');
    const toast = document.getElementById('toast');
    const state = { config: { maxFileMb: 500, googleLoginEnabled: false }, session: { user: null, profile: null }, category: '', query: '', homeOffset: 0, routeToken: 0, toastTimer: null };
    const categories = [
      { value:'', label:'সব ভিডিও' }, { value:'ভ্রমণ', label:'ভ্রমণ' }, { value:'রান্না', label:'রান্না' }, { value:'ক্রিয়েটর', label:'ক্রিয়েটর' }, { value:'গল্প', label:'গল্প' }, { value:'শেখা', label:'শেখা' }, { value:'অন্যান্য', label:'অন্যান্য' }
    ];
    const $ = (tag, props, children) => { const el = document.createElement(tag); if (props) Object.keys(props).forEach((key) => { if (key === 'class') el.className = props[key]; else if (key === 'text') el.textContent = props[key]; else if (key === 'htmlFor') el.htmlFor = props[key]; else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), props[key]); else if (key === 'dataset') Object.assign(el.dataset, props[key]); else el.setAttribute(key, props[key]); }); (children || []).forEach((child) => el.append(child)); return el; };
    const text = (value, fallback='') => value === null || value === undefined ? fallback : String(value);
    const initials = (value) => text(value, 'আ').trim().slice(0, 1).toUpperCase() || 'আ';
    const fmtSize = (bytes) => { const n = Number(bytes) || 0; if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB'; if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB'; if (n >= 1024) return (n / 1024).toFixed(0) + ' KB'; return n + ' B'; };
    const fmtDate = (date) => { if (!date) return 'তারিখ অজানা'; try { return new Intl.DateTimeFormat('bn-BD', { day:'numeric', month:'short', year:'numeric' }).format(new Date(date)); } catch (_) { return text(date); } };
    const getHandle = (profile, user) => text(profile && profile.handle, text(user && (user.handle || user.name), 'member')).replace(/^@/, '');
    const getName = (profile, user) => text(profile && profile.displayName, text(user && (user.name || user.email), 'ভিডিও নির্মাতা'));
    const escapePath = (part) => encodeURIComponent(text(part));
    function notify(message, kind='') { toast.textContent = message; toast.className = 'toast show'; if (kind === 'error') toast.style.borderColor = 'var(--danger)'; else toast.style.borderColor = ''; clearTimeout(state.toastTimer); state.toastTimer = setTimeout(() => { toast.className = 'toast'; }, 3600); }
    function setNotice(el, message, kind='') { if (!el) return; el.textContent = message; el.className = 'notice' + (kind ? ' ' + kind : ''); }
    async function jsonFetch(url, options={}) { const opts = { credentials:'same-origin', ...options, headers: { Accept:'application/json', ...(options.headers || {}) } }; if (opts.body && typeof opts.body !== 'string') { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.body); } const response = await fetch(url, opts); const data = await response.json().catch(() => ({})); if (!response.ok) { const error = new Error(text(data.error, text(data.message, 'অনুরোধটি সম্পন্ন করা যায়নি।'))); error.status = response.status; throw error; } return data; }
    function updateNav(route) { document.querySelectorAll('[data-nav]').forEach((link) => link.classList.toggle('active', route === link.dataset.nav)); }
    function navigate(path) { if (location.pathname + location.search !== path) history.pushState({}, '', path); closeMobile(); renderRoute(); }
    function closeMobile() { mainNav.classList.remove('open'); mobileToggle.setAttribute('aria-expanded', 'false'); }
    function button(label, cls='btn btn-ghost', handler=null) { return $('button', { class:cls, type:'button', text:label, ...(handler ? { onClick:handler } : {}) }); }
    function linkButton(label, path, cls='btn btn-primary') { return $('a', { class:cls, href:path, 'data-route':'', text:label }); }
